[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waveqtl-2d"
version = "0.1.0"
description = "Prototype 2D matrix comparison wrapper around WaveQTL using 2D Haar wavelets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "PyWavelets>=1.4",
]

[project.scripts]
waveqtl-2d = "waveqtl2d.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["waveqtl2d*"]

[tool.setuptools.package-data]
waveqtl2d = ["bin/*"]
